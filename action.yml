name: dry-run-gate
description: Skills with external side effects must ship a no-network --dry-run
inputs:
  args:
    description: Arguments for dry_run_gate.py
    default: "."
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GATE_ARGS: ${{ inputs.args }}
      run: python3 "$GITHUB_ACTION_PATH/dry_run_gate.py" $GATE_ARGS
