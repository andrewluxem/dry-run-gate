<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d">
<title id="t">dry-run-gate</title>
<desc id="d">Three panels. 1, the repo's failing test fixture testnet-connect: its publish.py sets API_HOST = "192.0.2.1" and, inside if args.dry_run:, still calls api_reachable(), which runs probe.connect((API_HOST, 443)). 2, real output of python3 dry_run_gate.py tests/fixtures/fail: R1 FAIL, 1 guard event(s): socket.connect 192.0.2.1:443, stdout API reachable: False, R2 FAIL exit 1, and exit: 1 (2 FAIL, 0 WARN, 0 UNVERIFIED, 0 SKIP). 3, the passing fixture email-ok: R1 PASS, exit 0, no guard events, DRY RUN shown, no canary; R2 PASS, exit 0, no guard events, no canary.</desc>
<style>
.serif{font-family:Georgia,"Times New Roman",serif}
.sans{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.lab{font-size:10px;letter-spacing:1.8px;font-weight:600}
.cap{font-size:11.5px;fill:#8b9096}
.hl{fill:none;stroke-width:1.5;opacity:0}
.h1{animation:h1 12s infinite}
.h2{animation:h2 12s infinite}
.h3{animation:h3 12s infinite}
.r1{animation:r1 12s infinite}
.rb{animation:rb 12s infinite}
.rc{animation:rc 12s infinite}
.rd{animation:rd 12s infinite}
.re{animation:re 12s infinite}
.rf{animation:rf 12s infinite}
.rh{animation:rh 12s infinite}
.ri{animation:ri 12s infinite}
@keyframes h1{0%,16.7%{opacity:0}18.7%,42.4%{opacity:1}44.1%,100%{opacity:0}}
@keyframes h2{0%,16.7%,18.7%,44.1%{opacity:0}45.8%,67.8%{opacity:1}69.5%,100%{opacity:0}}
@keyframes h3{0%,16.7%,18.7%,69.5%{opacity:0}71.2%,94.9%{opacity:1}96.6%,100%{opacity:0}}
@keyframes r1{0%,16.7%{opacity:1}18.7%,20.4%{opacity:0}22.1%,100%{opacity:1}}
@keyframes rb{0%,16.7%{opacity:1}18.7%,45%{opacity:0}46.6%,100%{opacity:1}}
@keyframes rc{0%,16.7%{opacity:1}18.7%,48.3%{opacity:0}50%,100%{opacity:1}}
@keyframes rd{0%,16.7%{opacity:1}18.7%,53.4%{opacity:0}55.1%,100%{opacity:1}}
@keyframes re{0%,16.7%{opacity:1}18.7%,58.5%{opacity:0}60.2%,100%{opacity:1}}
@keyframes rf{0%,16.7%{opacity:1}18.7%,63.6%{opacity:0}65.3%,100%{opacity:1}}
@keyframes rh{0%,16.7%{opacity:1}18.7%,72.9%{opacity:0}74.6%,100%{opacity:1}}
@keyframes ri{0%,16.7%{opacity:1}18.7%,81.4%{opacity:0}83.1%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="900" height="300" fill="#141618"/>

<text x="32" y="50" class="serif" font-size="28" fill="#e4dfd4">dry-run-gate</text>
<text x="207" y="50" class="sans" font-size="13.5" fill="#a9adb2">CI check that a skill's --dry-run makes no outbound connection, starts no process, leaks no secret</text>

<g>
<text x="32" y="88" class="sans lab" fill="#a39bbd">1 · A CARELESS DRY-RUN</text>
<rect x="32" y="98" width="252" height="152" rx="3" fill="#1b1e21" stroke="#2e3237"/>
<rect class="hl h1" x="32" y="98" width="252" height="152" rx="3" stroke="#a39bbd"/>
<text x="44" y="115" class="mono" font-size="10" fill="#8b9096">testnet-connect/scripts/publish.py</text>
<line x1="33" y1="123" x2="283" y2="123" stroke="#2e3237"/>
<g class="r1">
<text x="44" y="143" class="mono" font-size="10" fill="#e4dfd4">API_HOST = "192.0.2.1"</text>
<text x="44" y="163" class="mono" font-size="10" fill="#e4dfd4">def api_reachable() -&gt; bool:</text>
<text x="44" y="177" class="mono" font-size="10" fill="#e4dfd4" xml:space="preserve">        probe.connect((API_HOST, 443))</text>
<text x="44" y="203" class="mono" font-size="10" fill="#e4dfd4" xml:space="preserve">    if args.dry_run:</text>
<text x="44" y="217" class="mono" font-size="10" fill="#e4dfd4" xml:space="preserve">        reachable = api_reachable()</text>
</g>
<rect class="rc" x="89" y="167" width="186" height="14" fill="none" stroke="#c8963e" stroke-dasharray="3 2"/>
<rect class="rd" x="89" y="207" width="168" height="14" fill="none" stroke="#c8963e" stroke-dasharray="3 2"/>
<text x="32" y="272" class="sans cap">Its dry-run still tries to reach the API.</text>
</g>

<g>
<text x="304" y="88" class="sans lab" fill="#c8963e">2 · THE GATE BLOCKS IT</text>
<rect x="304" y="98" width="302" height="152" rx="3" fill="#17191c" stroke="#2e3237"/>
<rect class="hl h2" x="304" y="98" width="302" height="152" rx="3" stroke="#c8963e"/>
<text x="316" y="118" class="mono rb" font-size="10" fill="#8b9096">$ python3 dry_run_gate.py tests/fixtures/fail</text>
<g class="rc"><text x="316" y="140" class="mono" font-size="10" fill="#e4dfd4" xml:space="preserve">R1  <tspan fill="#c8963e">FAIL</tspan>       1 guard event(s):</text><text x="316" y="154" class="mono" font-size="10" fill="#e4dfd4" xml:space="preserve">               socket.connect 192.0.2.1:443</text></g>
<g class="rd"><text x="316" y="172" class="mono" font-size="10" fill="#8b9096" xml:space="preserve">      stdout | API reachable: False</text></g>
<g class="re"><text x="316" y="194" class="mono" font-size="10" fill="#e4dfd4" xml:space="preserve">R2  <tspan fill="#c8963e">FAIL</tspan>       exit 1</text></g>
<g class="rf"><line x1="316" y1="210.5" x2="594" y2="210.5" stroke="#2e3237"/><text x="316" y="228" class="mono" font-size="10" fill="#e4dfd4" font-weight="700">exit: 1 (2 FAIL, 0 WARN, 0 UNVERIFIED, 0 SKIP)</text></g>
<text x="304" y="272" class="sans cap">Blocked before any packet; exit 1 fails CI.</text>
</g>

<g>
<text x="626" y="88" class="sans lab" fill="#93ad8c">3 · A PRINT-ONLY DRY-RUN</text>
<rect x="626" y="98" width="242" height="152" rx="3" fill="#17191c" stroke="#2e3237"/>
<rect class="hl h3" x="626" y="98" width="242" height="152" rx="3" stroke="#93ad8c"/>
<text x="638" y="115" class="mono" font-size="10" fill="#8b9096">tests/fixtures/pass · email-ok</text>
<line x1="627" y1="123" x2="867" y2="123" stroke="#2e3237"/>
<g class="rh"><text x="638" y="143" class="mono" font-size="10" fill="#e4dfd4" xml:space="preserve">R1  <tspan fill="#93ad8c">PASS</tspan></text><text x="638" y="157" class="mono" font-size="10" fill="#e4dfd4" xml:space="preserve">    exit 0, no guard events,</text><text x="638" y="171" class="mono" font-size="10" fill="#e4dfd4" xml:space="preserve">    DRY RUN shown, no canary</text></g>
<g class="ri"><text x="638" y="195" class="mono" font-size="10" fill="#e4dfd4" xml:space="preserve">R2  <tspan fill="#93ad8c">PASS</tspan></text><text x="638" y="209" class="mono" font-size="10" fill="#e4dfd4" xml:space="preserve">    exit 0, no guard events,</text><text x="638" y="223" class="mono" font-size="10" fill="#e4dfd4" xml:space="preserve">    no canary</text></g>
<text x="626" y="272" class="sans" font-size="11.5" fill="#93ad8c">A print-only dry-run passes with exit 0.</text>
</g>
</svg>
